<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bhavesh AI – by Bhavesh Matade</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff;--side:#f0f4f9;--panel:#f0f4f9;--hover:#e3e8ef;--text:#1f1f1f;--muted:#5f6368;
  --user:#e9eef6;--accent:#4285f4;--code:#f6f8fa;--border:#dadce0;
  --grad:linear-gradient(90deg,#4285f4,#9b72cb,#d96570);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131314;--side:#1e1f20;--panel:#1e1f20;--hover:#2d2f31;--text:#e3e3e3;--muted:#9aa0a6;
    --user:#282a2c;--accent:#8ab4f8;--code:#0d0d0e;--border:#3c4043;
  }
}
:root[data-theme="dark"]{
  --bg:#131314;--side:#1e1f20;--panel:#1e1f20;--hover:#2d2f31;--text:#e3e3e3;--muted:#9aa0a6;
  --user:#282a2c;--accent:#8ab4f8;--code:#0d0d0e;--border:#3c4043;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Google Sans","Segoe UI",Roboto,system-ui,-apple-system,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:flex;height:100%;width:100%}

/* sidebar */
.side{width:280px;background:var(--side);display:flex;flex-direction:column;padding:12px;flex-shrink:0;transition:transform .25s}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.icon-btn:hover{background:var(--hover)}
.new{display:flex;align-items:center;gap:10px;margin:14px 0 18px;padding:10px 16px;border-radius:999px;background:var(--hover);width:max-content;font-size:14px}
.side h4{margin:8px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.hist{flex:1;overflow-y:auto}
.hist button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:999px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist button:hover,.hist button.on{background:var(--hover)}
.credit{font-size:12px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--border)}
.credit b{color:var(--text)}
.scrim{display:none}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{display:flex;align-items:center;gap:6px;padding:10px 12px}
.brand{font-size:20px;font-weight:500;margin-right:auto}
.menu{display:none}
.chat{flex:1;overflow-y:auto;padding:0 16px}
.wrap{max-width:780px;margin:0 auto;padding-bottom:16px}
.hero{padding-top:8vh}
.hero h1{font-size:clamp(30px,7vw,54px);font-weight:500;margin:0;line-height:1.15;letter-spacing:-.5px}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h2{font-size:clamp(28px,6vw,48px);font-weight:500;margin:4px 0 0;color:var(--muted);opacity:.7}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:32px}
.card{background:var(--panel);border-radius:16px;padding:14px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font-size:14px;line-height:1.35}
.card:hover{background:var(--hover)}
.card i{font-style:normal;align-self:flex-end;font-size:20px;background:var(--bg);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}

.msg{display:flex;gap:12px;margin:22px 0}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--user);padding:10px 16px;border-radius:20px 20px 4px 20px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.avatar{width:28px;height:28px;flex-shrink:0;margin-top:2px}
.msg.ai .bubble{flex:1;min-width:0;line-height:1.65;font-size:16px;overflow-wrap:anywhere}
.bubble p{margin:0 0 12px}
.bubble h1,.bubble h2,.bubble h3{margin:16px 0 8px;font-weight:600}
.bubble h1{font-size:22px}.bubble h2{font-size:19px}.bubble h3{font-size:17px}
.bubble ul,.bubble ol{margin:0 0 12px;padding-left:24px}
.bubble code{background:var(--code);padding:2px 6px;border-radius:6px;font-size:.9em;font-family:ui-monospace,Menlo,Consolas,monospace}
.bubble pre{background:var(--code);border-radius:12px;padding:14px;overflow-x:auto;margin:0 0 12px;max-width:100%}
.bubble pre code{padding:0;background:none}
.thinking{display:flex;gap:6px;padding:10px 0}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--grad);background:#9b72cb;animation:b 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s;background:#4285f4}
.thinking i:nth-child(3){animation-delay:.3s;background:#d96570}
@keyframes b{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
.actions{display:flex;gap:4px;margin-top:4px}
.actions button{font-size:12px;color:var(--muted);padding:5px 10px;border-radius:999px}
.actions button:hover{background:var(--hover)}

/* input */
.bar{padding:8px 16px 6px}
.box{max-width:780px;margin:0 auto;background:var(--panel);border-radius:28px;padding:10px 10px 10px 20px;display:flex;align-items:flex-end;gap:8px}
.box textarea{flex:1;background:none;border:0;outline:0;resize:none;color:var(--text);font:inherit;font-size:16px;max-height:160px;padding:8px 0;line-height:1.4}
.send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0}
:root:not([data-theme="light"]) .send{color:#131314}
.send:disabled{opacity:.35;cursor:default}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:6px 16px 8px}
.foot b{color:var(--text);font-weight:500}

@media (max-width:820px){
  .menu{display:grid}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <button class="icon-btn" id="closeSide" aria-label="Close menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="new" id="newChat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> New chat
    </button>
    <h4>Recent</h4>
    <div class="hist" id="hist"></div>
    <div class="credit">Created by <b>Bhavesh Matade</b></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="top">
      <button class="icon-btn menu" id="openSide" aria-label="Open menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brand">Bhavesh AI</div>
      <button class="icon-btn" id="key" aria-label="API key">🔑</button>
      <button class="icon-btn" id="theme" aria-label="Toggle theme">◐</button>
    </div>

    <div class="chat" id="chat"><div class="wrap" id="wrap"></div></div>

    <div class="bar">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Ask Bhavesh AI"></textarea>
        <button class="send" id="send" disabled aria-label="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
    <div class="foot">Made by <b>Bhavesh Matade</b> · AI can make mistakes, so double-check replies.</div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const SYS = "You are Bhavesh AI, a helpful, friendly AI assistant created by Bhavesh Matade. If asked who made you or who owns this website, say Bhavesh Matade. Answer clearly, use markdown (short headings, lists, code blocks) when helpful.";
const SPARK = '<svg class="avatar" viewBox="0 0 28 28"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4285f4"/><stop offset=".5" stop-color="#9b72cb"/><stop offset="1" stop-color="#d96570"/></linearGradient></defs><path fill="url(#g)" d="M14 0c.7 7.6 6.4 13.3 14 14-7.6.7-13.3 6.4-14 14C13.3 20.4 7.6 14.7 0 14 7.6 13.3 13.3 7.6 14 0z"/></svg>';
const SUGGEST = [
  ["Explain quantum computing in simple words","💡"],
  ["Write a Python script to rename files in a folder","💻"],
  ["Plan a 3-day trip to Goa on a budget","🧭"],
  ["Help me write a polite email to my manager","✍️"]
];

let chats = [];      // {id,title,msgs:[{role,content}]}
let cur = null;
let busy = false;
let ctrl = null;
function getKey(){ try{return localStorage.getItem("bhavesh-ai-key")||""}catch(e){return ""} }
function setKey(){ const k=prompt("Paste your free Google Gemini API key (get one at aistudio.google.com/apikey):", getKey()); if(k!==null){ try{localStorage.setItem("bhavesh-ai-key",k.trim())}catch(e){} } }
async function gemini(chat,onText,signal){
  if(!getKey()){ setKey(); if(!getKey()) throw {code:"no_key",message:"Tap the 🔑 button at the top and add your Gemini API key to start chatting."}; }
  const body={systemInstruction:{parts:[{text:SYS}]},contents:chat.msgs.map(m=>({role:m.role==="user"?"user":"model",parts:[{text:m.content}]}))};
  const MODELS=["gemini-3.6-flash","gemini-flash-latest","gemini-flash-lite-latest"];
  let r=null,lastStatus=0,lastMsg="";
  for(let round=0;round<3&&!(r&&r.ok);round++){
    for(const m of MODELS){
      try{
        r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":streamGenerateContent?alt=sse",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":getKey()},body:JSON.stringify(body),signal});
      }catch(e){ if(e&&e.name==="AbortError") throw e; r=null; lastMsg="Network problem. Check your internet."; continue; }
      if(r.ok) break;
      lastStatus=r.status; try{lastMsg=(await r.json()).error.message}catch(e){}
      if(![503,429,404,500].includes(r.status)) throw {code:"http",message:"Gemini error ("+r.status+"): "+(lastMsg||"please check your API key.")};
    }
    if(!(r&&r.ok)) await new Promise(res=>setTimeout(res,1500*(round+1)));
  }
  if(!(r&&r.ok)) throw {code:"http",message:"Google's servers are very busy right now"+(lastStatus?" ("+lastStatus+")":"")+". Please try again in a minute."};
  const rd=r.body.getReader(),dec=new TextDecoder(); let buf="",full="";
  while(true){ const {done,value}=await rd.read(); if(done)break; buf+=dec.decode(value,{stream:true}); const lines=buf.split("\n"); buf=lines.pop();
    for(const l of lines){ if(l.startsWith("data:")){ try{ const j=JSON.parse(l.slice(5)); const t=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||"").join(""); if(t){full+=t;onText(full);} }catch(e){} } } }
  return full;
}

/* storage helpers (safe) */
function load(){ try{ chats = JSON.parse(localStorage.getItem("bhavesh-ai-chats")||"[]"); }catch(e){ chats=[]; } }
function save(){ try{ localStorage.setItem("bhavesh-ai-chats", JSON.stringify(chats.slice(0,30))); }catch(e){} }

/* markdown (small) */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inline(s){
  return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>");
}
function md(src){
  const parts = src.split(/```/);
  let out = "";
  parts.forEach((p,i)=>{
    if(i%2){ out += "<pre><code>"+esc(p.replace(/^[^\n]*\n/,""))+"</code></pre>"; return; }
    const lines = p.split("\n"); let list=null, para=[];
    const flushP=()=>{ if(para.length){ out+="<p>"+para.join("<br>")+"</p>"; para=[]; } };
    const flushL=()=>{ if(list){ out+="</"+list+">"; list=null; } };
    lines.forEach(l=>{
      let m;
      if((m=l.match(/^(#{1,3})\s+(.*)/))){ flushP();flushL(); const n=m[1].length; out+=`<h${n}>${inline(m[2])}</h${n}>`; }
      else if((m=l.match(/^\s*[-*]\s+(.*)/))){ flushP(); if(list!=="ul"){flushL();out+="<ul>";list="ul";} out+="<li>"+inline(m[1])+"</li>"; }
      else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ flushP(); if(list!=="ol"){flushL();out+="<ol>";list="ol";} out+="<li>"+inline(m[1])+"</li>"; }
      else if(!l.trim()){ flushP();flushL(); }
      else { flushL(); para.push(inline(l)); }
    });
    flushP();flushL();
  });
  return out;
}

/* rendering */
function scrollDown(){ const c=$("chat"); c.scrollTop=c.scrollHeight; }
function renderHero(){
  $("wrap").innerHTML = `<div class="hero"><h1><span>Hello, friend</span></h1><h2>How can I help you today?</h2>
    <div class="cards">${SUGGEST.map((s,i)=>`<button class="card" data-i="${i}"><span>${s[0]}</span><i>${s[1]}</i></button>`).join("")}</div></div>`;
  document.querySelectorAll(".card").forEach(b=>b.onclick=()=>ask(SUGGEST[b.dataset.i][0]));
}
function bubbleHTML(m){
  return m.role==="user"
    ? `<div class="msg user"><div class="bubble">${esc(m.content)}</div></div>`
    : `<div class="msg ai">${SPARK}<div class="bubble"><div class="body">${md(m.content)}</div>
       <div class="actions"><button data-copy>Copy</button></div></div></div>`;
}
function renderChat(){
  if(!cur || !cur.msgs.length){ renderHero(); return; }
  $("wrap").innerHTML = cur.msgs.map(bubbleHTML).join("");
  bindCopy(); scrollDown();
}
function bindCopy(){
  document.querySelectorAll("[data-copy]").forEach((b,i)=>{
    const aiMsgs = cur.msgs.filter(m=>m.role==="assistant");
    b.onclick=async()=>{ try{ await navigator.clipboard.writeText(aiMsgs[i].content); b.textContent="Copied"; setTimeout(()=>b.textContent="Copy",1200);}catch(e){} };
  });
}
function renderHist(){
  $("hist").innerHTML = chats.map(c=>`<button data-id="${c.id}" class="${cur&&cur.id===c.id?"on":""}">${esc(c.title)}</button>`).join("");
  document.querySelectorAll("#hist button").forEach(b=>b.onclick=()=>{ cur=chats.find(c=>c.id===b.dataset.id); renderChat(); renderHist(); closeSide(); });
}

/* chat logic */
function newChat(){
  if(busy && ctrl) ctrl.abort();
  cur = {id:String(Date.now()), title:"New chat", msgs:[]};
  renderChat(); renderHist(); closeSide(); $("input").focus();
}
async function ask(text){
  text = text.trim(); if(!text || busy) return;
  if(!cur) newChat();
  if(!chats.includes(cur)){ chats.unshift(cur); }
  if(!cur.msgs.length) cur.title = text.slice(0,40);
  cur.msgs.push({role:"user",content:text});
  $("input").value=""; grow(); setBusy(true);
  renderChat(); renderHist();

  const wrap=$("wrap");
  wrap.insertAdjacentHTML("beforeend",`<div class="msg ai" id="live">${SPARK}<div class="bubble"><div class="thinking"><i></i><i></i><i></i></div></div></div>`);
  scrollDown();
  const liveBubble = document.querySelector("#live .bubble");

  try{
    ctrl = new AbortController();
    const text = await gemini(cur, t=>{ liveBubble.innerHTML='<div class="body">'+md(t)+'</div>'; scrollDown(); }, ctrl.signal);
    cur.msgs.push({role:"assistant",content:text||"I couldn't generate a reply. Please try again."});
  }catch(e){
    let msg = "Sorry, something went wrong. Please try again.";
    if(e && (e.code==="cancelled"||e.name==="AbortError")) msg = e.text || "Stopped.";
    else if(e && e.code==="not_granted") msg = "Permission was declined. Allow Bhavesh AI to use Claude when asked, then try again.";
    else if(e && e.code==="rate_limited") msg = "Too many requests right now. Please wait a moment.";
    else if(e && (e.code==="no_key"||e.code==="http")) msg = e.message;
    if(e && e.text) msg = e.text;
    cur.msgs.push({role:"assistant",content:msg});
  }
  ctrl=null; setBusy(false); save(); renderChat(); renderHist();
}
function setBusy(b){ busy=b; $("send").disabled = b || !$("input").value.trim(); }

/* UI wiring */
function grow(){ const t=$("input"); t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,160)+"px"; $("send").disabled = busy || !t.value.trim(); }
$("input").addEventListener("input",grow);
$("input").addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.shiftKey && window.innerWidth>820){ e.preventDefault(); ask($("input").value); } });
$("send").onclick=()=>ask($("input").value);
$("newChat").onclick=newChat;
function closeSide(){ $("app").classList.remove("open"); }
$("openSide").onclick=()=>$("app").classList.add("open");
$("closeSide").onclick=closeSide; $("scrim").onclick=closeSide;
$("key").onclick=setKey;
$("theme").onclick=()=>{
  const r=document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};

load(); renderHist(); renderHero();

</script>
</body>
</html>
